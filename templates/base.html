<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tacks{% endblock %}</title>
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', saved || 'dark');
      })();
    </script>
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/app.js" defer></script>
</head>
<body>
    <nav class="container nav-tabs">
        <ul>
            <li><strong>Tacks</strong></li>
        </ul>
        <ul>
            <li><a id="nav-issues" href="{{ layout.prefix }}/tasks" hx-get="{{ layout.prefix }}/tasks" hx-target="#main" hx-select="#main" hx-swap="outerHTML scroll:top" hx-push-url="true">Issues</a></li>
            <li><a id="nav-board" href="{{ layout.prefix }}/board" hx-get="{{ layout.prefix }}/board" hx-target="#main" hx-select="#main" hx-swap="outerHTML scroll:top" hx-push-url="true">Board</a></li>
            <li><a id="nav-epics" href="{{ layout.prefix }}/epics" hx-get="{{ layout.prefix }}/epics" hx-target="#main" hx-select="#main" hx-swap="outerHTML scroll:top" hx-push-url="true">Epics</a></li>
            <li>
                <button class="outline new-issue-btn"
                    data-shortcut="n"
                    hx-get="{{ layout.prefix }}/tasks/new/modal"
                    hx-target="#task-modal"
                    hx-swap="innerHTML"
                    hx-on:htmx:after-swap="document.getElementById('task-modal').showModal()">
                    New Issue
                </button>
            </li>
            <li>
                <div class="settings-dropdown" id="settings-dropdown">
                    <button id="settings-gear" class="outline secondary settings-gear-btn" aria-label="Settings" aria-expanded="false">&#9881;</button>
                    <ul class="settings-menu" id="settings-menu" hidden>
                        <li><button id="theme-toggle" class="settings-menu-btn">&#9680; Toggle dark mode</button></li>
                    </ul>
                </div>
            </li>
        </ul>
    </nav>
    <div class="app-layout">
        {% if let Some(sb) = layout.sidebar.as_ref() %}
        {% include "partials/sidebar.html" %}
        {% endif %}
        <main class="container" id="main">
            {% block content %}{% endblock %}
        </main>
    </div>
    <dialog id="task-modal"></dialog>
    <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
