{% import "macros.html" as m %}
<article>
  <header>
    <h3 data-editable data-field="title" data-task-id="{{ task.id }}">{{ task.title }}</h3>
    <div class="modal-header-actions">
      <a class="modal-open-full" href="/tasks/{{ task.id }}" aria-label="Open in full page" title="Open in full page"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>
      <button aria-label="Close" rel="prev" onclick="document.getElementById('task-modal').close()"></button>
    </div>
  </header>

  {% include "partials/task_meta.html" %}
  {% include "partials/task_body.html" %}
</article>
