<article>
  <header>
    <h3>New Issue</h3>
    <button aria-label="Close" rel="prev" onclick="document.getElementById('task-modal').close()"></button>
  </header>

  <form id="create-task-form" class="compact-form">
    <div class="form-row">
      <label for="create-title">Title</label>
      <input type="text" id="create-title" name="title" placeholder="Short summary" required autofocus>
    </div>

    <div class="form-row">
      <label for="create-description">Description <span class="label-hint">(optional)</span></label>
      <textarea id="create-description" name="description" rows="3"></textarea>
    </div>

    <div class="grid">
      <div class="form-row">
        <label for="create-priority">Priority</label>
        <select id="create-priority" name="priority">
          <option value="0">P0 — Critical</option>
          <option value="1">P1 — High</option>
          <option value="2" selected>P2 — Medium</option>
          <option value="3">P3 — Low</option>
          <option value="4">P4 — Trivial</option>
        </select>
      </div>

      <div class="form-row">
        <label for="create-status">Status</label>
        <select id="create-status" name="status">
          <option value="open" selected>Open</option>
          <option value="in_progress">In Progress</option>
          <option value="blocked">Blocked</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="form-row">
        <label for="create-tags">Tags <span class="label-hint">(comma-separated)</span></label>
        <input type="text" id="create-tags" name="tags">
      </div>
      <div class="form-row">
        <label for="create-assignee">Assignee <span class="label-hint">(optional)</span></label>
        <input type="text" id="create-assignee" name="assignee">
      </div>
    </div>

    <div class="form-row">
      <label for="create-parent">Parent epic</label>
      <select id="create-parent" name="parent_id">
        <option value="">No parent epic</option>
        {% for epic in epics %}
        <option value="{{ epic.id }}">{{ epic.id }}: {{ epic.title }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-row">
      {% if let Some(w) = fixed_workspace.as_ref() %}
      <span class="form-label" id="create-workspace-label">Workspace</span>
      <input type="hidden" name="workspace_id" value="{{ w.id }}">
      <p class="ws-fixed" aria-labelledby="create-workspace-label"><span class="badge ws-badge">{{ w.name }}</span></p>
      {% else %}
      <label for="create-workspace">Workspace</label>
      <select id="create-workspace" name="workspace_id">
        <option value="">No workspace (unscoped)</option>
        {% for g in ws_groups.iter() %}
        <optgroup label="{{ g.project_name }}">
          {% for o in g.options.iter() %}
          <option value="{{ o.id }}"{% if o.selected %} selected{% endif %}>{{ o.name }}</option>
          {% endfor %}
        </optgroup>
        {% endfor %}
      </select>
      {% endif %}
      <small class="ws-move-hint">Subtasks (with a parent epic) use their parent's workspace.</small>
    </div>

    <footer class="modal-actions">
      <button type="button" class="secondary outline" onclick="document.getElementById('task-modal').close()">Cancel</button>
      <button type="submit">Create Issue</button>
    </footer>
  </form>
</article>
