{% extends "base.html" %}

{% block title %}New Task — Tacks{% endblock %}

{% block content %}
<h1>New Task</h1>

<form method="post" action="{{ prefix }}/tasks">
  <label for="title">title
    <input type="text" id="title" name="title" placeholder="Task title" required>
  </label>
  <label for="priority">priority
    <select id="priority" name="priority">
      <option value="0">P0 — Critical</option>
      <option value="1">P1 — High</option>
      <option value="2" selected>P2 — Medium</option>
      <option value="3">P3 — Low</option>
      <option value="4">P4 — Trivial</option>
    </select>
  </label>
  <label for="description">description
    <textarea id="description" name="description" placeholder="Task description (optional)"></textarea>
  </label>
  <label for="workspace_id">workspace
    <select id="workspace_id" name="workspace_id">
      <option value=""{% if default_workspace.is_none() %} selected{% endif %}>none (unscoped)</option>
      {% for g in ws_groups.iter() %}
      <optgroup label="{{ g.project_name }}">
        {% for o in g.options.iter() %}
        <option value="{{ o.id }}"{% if o.selected %} selected{% endif %}>{{ o.name }}</option>
        {% endfor %}
      </optgroup>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Create Task</button>
</form>
{% endblock %}
